[package]
name = "chess-engine-battel"
version = "0.0.1"
edition = "2024"
description = "Chess engine battle visualizer (Bevy + egui_dock + Axum)"
authors = ["mahd"]

[dependencies]
# gui
bevy = "0.20.1"
bevy_egui = "0.43.1"
egui = "0.36"
egui_dock = "0.21.1"
# networking
crossbeam-channel = "0.5.17"
axum = { version = "0.8.9", features = [
  "default",
  "form",
  "http2",
  "json",
  "macros",
  "matched-path",
  "multipart",
  "original-uri",
  "query",
  "tokio",
  "tower-log",
  "tracing",
  "ws",
] }
tokio = { version = "1.54.1", features = [
  "bytes",
  "default",
  "fs",
  "full",
  "io-std",
  "io-uring",
  "io-util",
  "libc",
  "macros",
  "mio",
  "net",
  "parking_lot",
  "process",
  "rt",
  "rt-multi-thread",
  "schedule-latency",
  "signal",
  "signal-hook-registry",
  "socket2",
  "sync",
  "taskdump",
  "test-util",
  "time",
  "tokio-macros",
  "tracing",
  "windows-sys",
] }
# cli
clap = { version = "4", features = [
  "cargo",
  "color",
  #"debug",
  "default",
  "deprecated",
  "derive",
  "env",
  "error-context",
  "help",
  "std",
  "string",
  "suggestions",
  "unicode",
  #"unstable-derive-ui-tests",
  #"unstable-doc",
  #"unstable-ext",
  #"unstable-markdown",
  #"unstable-styles",
  #"unstable-v5",
  "usage",
  "wrap_help",
] }


[build-dependencies]
png = "*"
