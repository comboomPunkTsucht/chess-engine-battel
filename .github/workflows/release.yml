name: Release (Linux, macOS, Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x11
            ext: ""
            nob_flags: "--with-x11"
            archive_ext: ".tar.gz"

          - os: ubuntu-latest
            name: linux-wayland
            ext: ""
            nob_flags: ""
            archive_ext: ".tar.gz"

          - os: macos-latest
            name: macos-arm64
            ext: ""
            nob_flags: ""
            archive_ext: ".tar.gz"

          - os: windows-latest
            name: windows-x86_64
            ext: ".exe"
            nob_flags: ""
            archive_ext: ".zip"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux Abhängigkeiten installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgl-dev libglu1-mesa-dev pkg-config libwayland-dev libxkbcommon-dev wayland-protocols

          if [ "${{ matrix.name }}" = "linux-x11" ]; then
            sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev
          fi

      - name: Windows Abhängigkeiten installieren
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v make > /dev/null 2>&1; then
            choco install make -y
          fi
          gcc --version
          make --version
          clang --version

      - name: nob kompilieren und Projekt bauen
        shell: bash
        run: |
          clang++ -o "nob${{ matrix.ext }}" nob.cpp
          "./nob${{ matrix.ext }}" -c --release ${{ matrix.nob_flags }}

      - name: Release Ordner vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          STAGE="chess-engine-battel-${{ matrix.name }}"
          mkdir -p "$STAGE"

          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R build/chess-engine-battel.app "$STAGE/"
          else
            cp "build/chess-engine-battel${{ matrix.ext }}" "$STAGE/"
            cp -R build/assets "$STAGE/assets"
          fi

          cp LICENSE "$STAGE/LICENSE"
          ls -lR "$STAGE"

      - name: Archiv erstellen (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="chess-engine-battel-${{ matrix.name }}"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          ls -l "${STAGE}.tar.gz"

      - name: Archiv erstellen (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "chess-engine-battel-${{ matrix.name }}"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Get-Item "$stage.zip"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: chess-engine-battel-${{ matrix.name }}
          path: chess-engine-battel-${{ matrix.name }}${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Release erstellen
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums erstellen
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
