name: Release (Linux, macOS, Windows)

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive_ext: ".tar.gz"

          - os: macos-latest
            name: macos-arm64
            archive_ext: ".tar.gz"

          - os: windows-latest
            name: windows-x86_64
            archive_ext: ".zip"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: just installieren
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Systemabhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang g++ make cmake pkg-config \
            zlib1g-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl-dev libglu1-mesa-dev

      - name: Cargo configlesen
        run: |
          cargo config set build.rustc.flags "--remap-path-prefix=/home/runner/.cargo/git=/home/runner/cargo/git 2>/dev/null || true"

      - name: Cargo build (Release)
        run: cargo build --release

      - name: Binary prüfen
        run: |
          ./target/release/chess-engine-battel --help

      - name: Archiv erstellen (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp target/release/chess-engine-battel release/
          tar -czf chess-engine-battel-linux-x86_64.tar.gz -C release chess-engine-battel
          ls -l chess-engine-battel-linux-x86_64.tar.gz

      - name: Archiv erstellen (macOS)
        if: runner.os == 'macos-latest'
        run: |
          mkdir -p release
          cp target/release/chess-engine-battel release/
          tar -czf chess-engine-battel-macos-arm64.tar.gz -C release chess-engine-battel
          ls -l chess-engine-battel-macos-arm64.tar.gz

      - name: Archiv erstellen (Windows)
        if: runner.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir release
          Copy-Item -Path target/release/chess-engine-battel.exe -Destination release\
          Compress-Archive -Path release -DestinationPath chess-engine-battel-windows-x86_64.zip -Force
          ls -l chess-engine-battel-windows-x86_64.zip

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: chess-engine-battel-${{ matrix.name }}
          path: chess-engine-battel-${{ matrix.name }}${{ matrix.archive_ext }}
          if-no-files-found: error