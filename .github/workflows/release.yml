name: Release (Linux, macOS, Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x11
            ext: ""
            nob_flags: "--with-x11"
            archive_ext: ".tar.gz"

          - os: ubuntu-latest
            name: linux-wayland
            ext: ""
            nob_flags: ""
            archive_ext: ".tar.gz"

          - os: macos-latest
            name: macos-arm64
            ext: ""
            nob_flags: ""
            archive_ext: ".tar.gz"

          - os: windows-latest
            name: windows-x86_64
            ext: ".exe"
            nob_flags: ""
            archive_ext: ".zip"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux Abhängigkeiten installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ make cmake pkg-config libssl-dev zlib1g-dev \
            libgl-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols

          if [ "${{ matrix.name }}" = "linux-x11" ]; then
            sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev
          fi

      - name: Windows Abhängigkeiten installieren
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gcc > /dev/null 2>&1; then
            echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"
            export PATH="/c/msys64/mingw64/bin:$PATH"
          fi
          if ! command -v make > /dev/null 2>&1; then
            choco install make -y
          fi
          gcc --version
          make --version
          clang --version

          GCC_LIB="$(gcc -print-file-name=libgcc.a)"
          if [ -f "$GCC_LIB" ]; then
            echo "MINGW_RUNTIME_DIR=$(cygpath -m "$(dirname "$GCC_LIB")")" >> "$GITHUB_ENV"
          fi

      - name: nob kompilieren und Projekt bauen
        shell: bash
        run: |
          clang++ -o "nob${{ matrix.ext }}" nob.cpp
          "./nob${{ matrix.ext }}" -c --release ${{ matrix.nob_flags }}

      - name: Binary-Abhängigkeiten prüfen
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            llvm-objdump -p "build/chess-engine-battel${{ matrix.ext }}" | grep "DLL Name" || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            ldd build/chess-engine-battel || true
          else
            otool -L build/chess-engine-battel.app/Contents/MacOS/chess-engine-battel || true
          fi

      - name: Release Ordner vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          STAGE="chess-engine-battel-${{ matrix.name }}"
          mkdir -p "$STAGE"

          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R build/chess-engine-battel.app "$STAGE/"
          else
            cp "build/chess-engine-battel${{ matrix.ext }}" "$STAGE/"
            cp -R build/assets "$STAGE/assets"
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            for dll in libssl-3-x64.dll libcrypto-3-x64.dll; do
              if [ -f "C:/Program Files/OpenSSL/bin/$dll" ]; then
                cp "C:/Program Files/OpenSSL/bin/$dll" "$STAGE/"
              fi
            done
          fi

          cp LICENSE "$STAGE/LICENSE"
          ls -lR "$STAGE"

      - name: Archiv erstellen (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="chess-engine-battel-${{ matrix.name }}"
          COPYFILE_DISABLE=1 tar -czf "${STAGE}.tar.gz" "$STAGE"
          ls -l "${STAGE}.tar.gz"

      - name: Archiv erstellen (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "chess-engine-battel-${{ matrix.name }}"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Get-Item "$stage.zip"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: chess-engine-battel-${{ matrix.name }}
          path: chess-engine-battel-${{ matrix.name }}${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Release erstellen
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums erstellen
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
